<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a0845" />
      <stop offset="60%" stop-color="#110926" />
      <stop offset="100%" stop-color="#090a10" />
    </radialGradient>
    <linearGradient id="planeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" />
      <stop offset="50%" stop-color="#e91e63" />
      <stop offset="100%" stop-color="#ff4081" />
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff1744" stop-opacity="0.1" />
      <stop offset="50%" stop-color="#d500f9" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="1" />
    </linearGradient>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="100%" stop-color="#7c4dff" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded squircle with safe zone -->
  <rect width="512" height="512" rx="112" fill="url(#bgGlow)" />
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#ff007f" stroke-opacity="0.2" stroke-width="2" />

  <!-- Radar grid lines -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#251b47" stroke-width="2" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="120" fill="none" stroke="#251b47" stroke-width="2" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="60" fill="none" stroke="#251b47" stroke-width="2" stroke-dasharray="4 6" />
  <line x1="256" y1="40" x2="256" y2="472" stroke="#251b47" stroke-width="1.5" stroke-dasharray="4 6" />
  <line x1="40" y1="256" x2="472" y2="256" stroke="#251b47" stroke-width="1.5" stroke-dasharray="4 6" />

  <!-- Parabolic Flight Curve -->
  <path d="M 80 410 Q 240 390 350 190" fill="none" stroke="url(#curveGrad)" stroke-width="6" stroke-linecap="round" filter="url(#neonGlow)" />
  <path d="M 80 410 Q 240 390 350 190 L 350 410 Z" fill="url(#curveGrad)" fill-opacity="0.12" />

  <!-- Red Propeller Aviator Airplane Silhouette (Ascending) -->
  <g transform="translate(325, 160) rotate(-28)" filter="url(#neonGlow)">
    <!-- Exhaust trail particles -->
    <circle cx="-55" cy="4" r="5" fill="#ff4081" opacity="0.6" />
    <circle cx="-75" cy="8" r="4" fill="#d500f9" opacity="0.4" />
    <circle cx="-95" cy="12" r="3" fill="#00e5ff" opacity="0.25" />

    <!-- Main fuselage -->
    <path d="M -45 0 C -45 -9 30 -8 50 -1 C 55 1 55 3 50 5 C 30 12 -45 13 -45 0 Z" fill="url(#planeGrad)" />
    <!-- Cabin window -->
    <path d="M 5 -4 C 18 -5 28 -3 28 1 C 28 4 18 3 5 2 Z" fill="#ffffff" opacity="0.9" />
    <!-- Main Wing -->
    <path d="M -5 -22 L 15 -2 C 16 0 16 4 15 6 L -5 26 C -8 28 -11 26 -10 20 L -2 5 L -2 -3 L -10 -16 C -11 -22 -8 -24 -5 -22 Z" fill="#ff1744" />
    <!-- Wing highlight -->
    <path d="M -2 -18 L 12 -2 L 12 4 L -2 20 Z" fill="#ff5252" opacity="0.7" />
    <!-- Tail Fin -->
    <path d="M -42 0 L -30 -16 C -28 -18 -26 -17 -26 -14 L -28 0 Z" fill="#d50000" />
    <path d="M -42 0 L -34 -12 L -32 0 Z" fill="#ff5252" opacity="0.7" />
    <!-- Propeller Spinner -->
    <ellipse cx="52" cy="2" rx="4" ry="14" fill="#ffffff" opacity="0.85" />
  </g>

  <!-- 100x Multiplier Badge (Rosa Target) -->
  <g transform="translate(256, 420)">
    <rect x="-110" y="-28" width="220" height="48" rx="24" fill="url(#badgeGrad)" filter="url(#neonGlow)" />
    <text x="0" y="4" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">
      PREDICTOR PRO
    </text>
  </g>

  <!-- Top target 100X pill -->
  <g transform="translate(380, 95)">
    <rect x="-42" y="-18" width="84" height="36" rx="18" fill="#d500f9" filter="url(#neonGlow)" />
    <text x="0" y="6" font-family="system-ui, -apple-system, sans-serif" font-size="18" font-weight="900" fill="#ffffff" text-anchor="middle">
      100X
    </text>
  </g>
</svg>
