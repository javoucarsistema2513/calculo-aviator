<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="planeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="curveGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#ec4899" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer subtle border ring -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#e11d48" stroke-width="3" stroke-opacity="0.3"/>

  <!-- Radar Grid Circles -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>
  <circle cx="256" cy="256" r="60" fill="none" stroke="#374151" stroke-width="1.5" stroke-dasharray="6,6" opacity="0.4"/>

  <!-- Ascending Curve representing multiplier takeoff -->
  <path d="M 64 416 Q 220 400 310 270 T 400 130" fill="none" stroke="url(#curveGrad)" stroke-width="14" stroke-linecap="round"/>
  <path d="M 64 416 Q 220 400 310 270 T 400 130" fill="none" stroke="#ec4899" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Aviator Plane Icon -->
  <g transform="translate(360, 110) rotate(-25) scale(1.6)" filter="url(#glow)">
    <path d="M0 20 L24 2 L48 20 L30 18 L24 38 L18 18 Z" fill="url(#planeGrad)"/>
    <path d="M24 2 L24 38" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" opacity="0.7"/>
  </g>

  <!-- Multiplier Badge (100x+) -->
  <rect x="74" y="80" width="128" height="42" rx="12" fill="#ec4899" fill-opacity="0.15" stroke="#f43f5e" stroke-width="2"/>
  <text x="138" y="108" fill="#fb7185" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="22" text-anchor="middle" letter-spacing="1">100X+</text>

  <!-- Brand Typography -->
  <text x="256" y="440" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" text-anchor="middle" letter-spacing="2">PAI DO AVIATOR</text>
  <text x="256" y="474" fill="#a855f7" font-family="system-ui, -apple-system, sans-serif" font-weight="700" font-size="16" text-anchor="middle" letter-spacing="4">PREDICTOR &amp; RADAR</text>
</svg>
